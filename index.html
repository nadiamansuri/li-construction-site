<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Li Construction LLC</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#0B0B0B">
  <link rel="canonical" href="https://liconstructiongroup.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://liconstructiongroup.com/">
  <meta property="og:site_name" content="Li Construction LLC">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header dark" id="top">
    <div class="container header-inner">
      <a class="brand" href="#top" aria-label="Home">
        <img src="assets/logo-icon.svg" alt="" width="46" height="30">
        <span class="brand-text">
          <span class="brand-name" data-bind="brandName">LI CONSTRUCTION</span>
          <span class="brand-suffix" data-bind="brandSuffix">LLC</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <a class="header-phone" id="headerPhone" href="#"></a>
      <a class="btn btn-gold header-cta" href="#contact">Free quote</a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero dark" id="hero" aria-labelledby="heroTitle">
      <img class="hero-mark" src="assets/logo-icon.svg" alt="" aria-hidden="true">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow eyebrow-gold" id="heroEyebrow"></p>
          <h1 id="heroTitle"><span id="heroHeadline"></span> <span class="accent" id="heroAccent"></span></h1>
          <p class="lead" id="heroText"></p>
          <div class="btn-row" id="heroButtons"></div>
        </div>
        <aside class="hero-card" id="heroCard" aria-label="Highlights"></aside>
      </div>
    </section>

    <section class="section" id="services" aria-labelledby="servicesTitle">
      <div class="container">
        <header class="section-head" id="servicesHead"></header>
        <div class="grid cards-3" id="servicesGrid"></div>
      </div>
    </section>

    <section class="section paper" id="projects" aria-labelledby="projectsTitle">
      <div class="container">
        <header class="section-head" id="projectsHead"></header>
        <div class="filters" id="projectFilters" role="group" aria-label="Filter projects"></div>
        <div class="grid cards-3" id="projectsGrid"></div>
      </div>
    </section>

    <section class="section" id="about" aria-labelledby="aboutTitle">
      <div class="container about-grid">
        <div class="about-media" id="aboutMedia"></div>
        <div class="about-copy" id="aboutCopy"></div>
      </div>
    </section>

    <section class="stats dark" id="stats" aria-label="Company numbers">
      <div class="container stats-grid" id="statsGrid"></div>
    </section>

    <section class="section paper" id="process" aria-labelledby="processTitle">
      <div class="container">
        <header class="section-head" id="processHead"></header>
        <ol class="steps" id="processSteps"></ol>
      </div>
    </section>

    <section class="section" id="reviews" aria-labelledby="reviewsTitle">
      <div class="container">
        <header class="section-head" id="reviewsHead"></header>
        <div class="grid cards-3" id="reviewsGrid"></div>
      </div>
    </section>

    <section class="cta-band" id="cta" aria-labelledby="ctaTitle">
      <div class="container cta-inner" id="ctaInner"></div>
    </section>

    <section class="section" id="contact" aria-labelledby="contactTitle">
      <div class="container contact-grid">
        <div class="contact-info" id="contactInfo"></div>
        <form class="quote-form" id="quoteForm" novalidate>
          <div class="field">
            <label for="qName">Name</label>
            <input id="qName" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="qPhone">Phone</label>
              <input id="qPhone" name="phone" type="tel" autocomplete="tel" required>
            </div>
            <div class="field">
              <label for="qEmail">Email</label>
              <input id="qEmail" name="email" type="email" autocomplete="email" required>
            </div>
          </div>
          <div class="field">
            <label for="qService">Service</label>
            <select id="qService" name="service"></select>
          </div>
          <div class="field">
            <label for="qMessage">Tell us about your project</label>
            <textarea id="qMessage" name="message" rows="5" required></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
          </div>
          <button class="btn btn-black" type="submit" id="qSubmit">Send request</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer dark" id="footer">
    <div class="container footer-grid" id="footerGrid"></div>
    <div class="container footer-bottom" id="footerBottom"></div>
  </footer>

  <dialog class="project-dialog" id="projectDialog" aria-labelledby="dialogTitle">
    <button class="dialog-close" type="button" id="dialogClose" aria-label="Close"></button>
    <div class="dialog-body" id="dialogBody"></div>
  </dialog>

  <script src="data/site-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
